; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scriptinge
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = usb

[env:base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.f_cpu = 240000000
board_build.f_flash = 80000000
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partipltions = default_8MB.csv
board_build.psram = none
build_flags = 
	-DBOARD_HAS_PSRAM=0
	-DCONFIG_SPIRAM_BOOT_INIT=0
	-DARDUINO_USB_MODE=1          ; vypne OTG, zapne Hardware CDC/JTAG mód
    -DARDUINO_USB_CDC_ON_BOOT=0	  ; vypne CDC on boot (nepovinné, ale čisté)

[env:usb]
extends = env:base
upload_protocol = esptool
